<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile.jpg' | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}?v=dk-1" sizes="any">
    <link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}?v=dk-1" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}?v=dk-1">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}?v=dk-1">
    <link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}?v=dk-1">
    <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    {{ content }}
  </body>
</html>
